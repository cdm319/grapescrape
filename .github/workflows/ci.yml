name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Lint workspaces
        run: npm run lint

      - name: Type-check frontend
        run: npm --workspace @grapescrape/ui run typecheck

      - name: Build production frontend
        run: npm --workspace @grapescrape/ui run build

      - name: Synthesize CDK application
        run: npm run cdk:synth
